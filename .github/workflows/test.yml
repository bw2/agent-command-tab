name: unit tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: macOS py${{ matrix.python-version }}
    # macOS only: the app is built on AppKit through PyObjC, which installs and runs only on macOS.
    runs-on: macos-latest

    strategy:
      matrix:
        # From requires-python (>=3.10) in pyproject.toml to the newest release.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run tests
        run: python -m unittest discover -s tests -p '*_tests.py'
